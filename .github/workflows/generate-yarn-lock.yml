name: Generate Yarn lockfile once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  initialize-yarn:
    if: contains(github.event.head_commit.message, '[generate-yarn-lock]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Yarn Classic lockfile
        run: yarn install --non-interactive
      - name: Save Yarn lockfile and remove npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s yarn.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          if [ -f package-lock.json ]; then
            git rm package-lock.json
          fi
          git commit -m "build: track Yarn lockfile for reproducible dependencies"
          git push origin HEAD:main
